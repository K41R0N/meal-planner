name: Owner decision
description: A choice only the owner can make. Agents prepare options and evidence.
labels: ["type:decision", "status:needs-owner"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision needed
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: What it blocks
      description: Issues, milestones or gates waiting on this.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option with cost, risk, reversibility and the evidence behind it (with confidence tier).
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The preparer's recommendation and why. The owner decides.
  - type: textarea
    id: record
    attributes:
      label: Where the decision is recorded
      value: docs/decisions/README.md as a dated entry with rationale and owning contract.
