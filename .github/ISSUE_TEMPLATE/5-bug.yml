name: Bug or regression
description: Behavior differs from an owning contract or an eval fell below threshold.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected, and which document or eval says so
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots or eval output. No personal data or backups.
  - type: input
    id: regression
    attributes:
      label: Regression of
      description: Eval ID if this is a regression (also add the regression label).
