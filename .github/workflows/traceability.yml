name: Traceability

# Every pull request names the issue it serves (docs/operating/README.md).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  issue-link:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const linked = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of)\s+#\d+/i.test(body);
            if (!linked) {
              core.setFailed('Link this pull request to its issue: add "Closes #<n>" (or "Refs #<n>" for partial work) to the description. See docs/operating/README.md.');
            }
